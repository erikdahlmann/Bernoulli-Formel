<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Die Bernoulli-Formel</title>
<style>
  :root { --papier: #fbfaf7; --tinte: #2b2b33; --rot: #e2653f; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 32px 16px;
    background: var(--papier);
    color: var(--tinte);
    font-family: "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  h1 { margin: 0; font-size: clamp(28px, 5vw, 48px); font-weight: 700; text-align: center; }
  h1::after { content: ""; display: block; width: 120px; height: 6px; margin: 12px auto 0; border-radius: 3px; background: var(--rot); }
  video {
    width: min(100%, 1100px);
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    background: #000;
    box-shadow: 0 18px 50px rgba(40, 35, 30, 0.18);
  }
</style>
</head>
<body>
  <h1>Die Bernoulli-Formel</h1>
  <video controls preload="metadata" playsinline poster="vorschau.jpg">
    <source src="bernoulli-formel.mp4" type="video/mp4">
    Dein Browser kann dieses Video nicht abspielen.
  </video>
</body>
</html>
